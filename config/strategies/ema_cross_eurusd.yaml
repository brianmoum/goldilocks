# Deployment config for one strategy instance. The engine enforces everything here;
# the strategy code never sees its own capital limits.

strategy: ema_cross            # registry name (see @register in the strategy file)
asset_class: forex
mode: paper                    # backtest | paper | shadow | live
enabled: true

capital:
  allocation: "1000"           # Decimal string — max capital this instance may deploy
  max_position_pct: "50"       # max % of allocation in a single position

instruments:
  - EUR_USD

params:                        # passed to the Strategy constructor, strategy-specific
  fast_period: 12
  slow_period: 26
  timeframe: M15

backtest:                      # used only by `goldilocks backtest`
  start: 2026-01-01
  end: 2026-07-01
  spread: "0.00012"            # full bid/ask spread in price units (~1.2 pips EUR/USD)
