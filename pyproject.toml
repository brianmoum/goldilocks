[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldilocks"
version = "0.1.0"
description = "Multi-asset algorithmic trading framework: backtest, paper, and live deployment"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "python-dotenv>=1",
    "httpx>=0.27",
]

[project.optional-dependencies]
forex = []                                  # OANDA v20 REST is plain httpx; placeholder for future deps
alpaca = ["alpaca-py>=0.21"]
dashboard = ["rich>=13", "textual>=0.60", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
goldilocks = "goldilocks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
